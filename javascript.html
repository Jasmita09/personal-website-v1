  <main id="main">
    <section class="card">
      <h2>Interactive Scripting Controls</h2>
      
      <button onclick="showAlert()">Trigger Welcome Alert</button>
      <br><br>
      <button onclick="toggleClock()" id="clockButton">Show Clock</button>
      
      <div id="clock">00:00:00 am</div>
    </section>

    <section class="card">
      <h2>HTML5 Video Player Controls</h2>
      <video id="myvideo" width="100%" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        <track src="WEBVTT_captions.vtt" kind="captions" srclang="en" label="English" default>
      </video>

      <div style="margin-top: 15px;">
        <button onclick="playVideo()">Play</button>
        <button onclick="pauseVideo()">Pause</button>
        <button onclick="changeSpeed('up')">Faster</button>
        <button onclick="changeSpeed('down')">Slower</button>
        <button onclick="changeVolume('up')">Louder</button>
        <button onclick="changeVolume('down')">Softer</button>
      </div>
    </section>
  </main>
